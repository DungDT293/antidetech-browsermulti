<!DOCTYPE html>
<html><body><pre id="out">running</pre>
<script>
const R = {};

// 1. Error.stackTraceLimit visible value
R.stackTraceLimit = new Error().stackTraceLimit;

// 2. Deep recursion frame count captured in Error.stack
(function(){
  function f(n){ if (n <= 0) throw new Error('deep'); f(n - 1); }
  try { f(500); } catch (e) { R.deepFrames = e.stack.split('\n').length - 1; }
})();

// 3. Promise rejection stack: look for async markers / extra frames
R.promiseRejStackHasAsync = false;
R.promiseRejFrameCount = 0;
(async () => {
  async function inner(){ throw new Error('p'); }
  async function outer(){ await inner(); }
  try { await outer(); } catch (e) {
    const s = String(e.stack || '');
    R.promiseRejStackHasAsync = /async|Caused by/i.test(s);
    R.promiseRejFrameCount = s.split('\n').length - 1;
    R.promiseRejStr = s.slice(0, 200);
  }
})();

// 4. setTimeout(0) actual delays
(function(){
  const ds = [];
  let done = 0;
  for (let i = 0; i < 30; i++) {
    const t0 = performance.now();
    setTimeout(() => { ds.push(performance.now() - t0); if (++done === 30) {
      ds.sort((a,b)=>a-b);
      R.setTimeoutMin = +ds[0].toFixed(2);
      R.setTimeoutP50 = +ds[15].toFixed(2);
      finishCheck();
    } }, 0);
  }
})();

// 5. performance.timeOrigin fraction digits
R.timeOriginFrac = (performance.timeOrigin % 1);

// 6. Date.now vs timeOrigin skew stability
R.dateSkew = Math.abs(Date.now() - performance.timeOrigin - performance.now());

// 7. requestAnimationFrame timestamp quantization
(function(){
  let n = 0; const ds = []; let prev;
  function cb(t){ if (prev !== undefined && t > prev) ds.push(t - prev); prev = t;
    if (++n < 20) requestAnimationFrame(cb);
    else { ds.sort((a,b)=>a-b); R.rafMinDelta = +ds[0].toFixed(3); R.rafP50 = +ds[10].toFixed(3); finishCheck(); }
  }
  requestAnimationFrame(cb);
})();

// 8. console.time/timeEnd precision probe (does it fire getters?)
let timeEndGetter = false;
try {
  const label = 't' + Math.random();
  const o = {}; Object.defineProperty(o, 'z', { get(){ timeEndGetter = true; return 1; } });
  console.time(label); console.timeLog(label, o); console.timeEnd(label);
} catch(e){}
R.consoleTimeGetter = timeEndGetter;

// 9. microtask queue depth probe: queueMicrotask ordering timestamps
(function(){
  const ts = [];
  queueMicrotask(() => ts.push(performance.now()));
  queueMicrotask(() => ts.push(performance.now()));
  R.microtaskSameTick = ts.length === 2 ? (ts[1] === ts[0]) : null;
})();

// 10. timeOrigin+now vs Date.now skew - max over samples
(function(){
  let maxSkew = 0;
  for (let i = 0; i < 2000; i++) {
    const s = Math.abs(performance.now() + performance.timeOrigin - Date.now());
    if (s > maxSkew) maxSkew = s;
  }
  R.maxClockSkewMs = +maxSkew.toFixed(3);
})();

// 11. distinct performance.now() values per ms window
(function(){
  const vals = [];
  const end = performance.now() + 50;
  while (performance.now() < end) vals.push(performance.now());
  const base = Math.floor(vals[0]);
  const perMs = {};
  for (const v of vals) { const k = Math.floor(v - base); perMs[k] = (perMs[k]||0)+1; }
  R.maxDistinctPerMs = Math.max(...Object.values(perMs));
  R.totalSamples = vals.length;
})();

// 12. setTimeout(0) & setTimeout(1) distributions (100 samples each)
let _done = 0;
function finishCheck(){ if (++_done === 4) { summarizeDelays(); finish(); } }
(function(){
  const zero = [], one = [];
  let done = 0;
  function mk(arr){ return () => { arr.push(performance.now()); if (++done === 200) { finishCheck(); } }; }
  const t0s = [];
  for (let i = 0; i < 100; i++) { const t = performance.now(); setTimeout(mk(zero), 0); t0s.push(t); }
  const t1s = [];
  for (let i = 0; i < 100; i++) { const t = performance.now(); setTimeout(mk(one), 1); t1s.push(t); }
  // store start times to compute delays later
  window.__t0s = t0s; window.__t1s = t1s;
  window.__zeroArr = zero; window.__oneArr = one;
})();
function summarizeDelays(){
  try {
    const calc = (starts, ends) => starts.map((s,i)=>ends[i]-s).sort((a,b)=>a-b);
    const z = calc(window.__t0s, window.__zeroArr), o = calc(window.__t1s, window.__oneArr);
    R.setTimeout0Min = +z[0].toFixed(2); R.setTimeout0P50 = +z[50].toFixed(2); R.setTimeout0Max = +z[99].toFixed(2);
    R.setTimeout1Min = +o[0].toFixed(2); R.setTimeout1P50 = +o[50].toFixed(2); R.setTimeout1Max = +o[99].toFixed(2);
  } catch(e){}
}

// 14. Async overhead battery (stack-capture cost detector)
(async () => {
  const t0 = performance.now();
  // 2000 promise-chain hops
  let p = Promise.resolve();
  for (let i = 0; i < 2000; i++) p = p.then(() => {});
  await p;
  R.promiseChainMs = +(performance.now() - t0).toFixed(1);

  // 100 sequential setTimeout(0) round trips
  const t1 = performance.now();
  await new Promise((done) => {
    let n = 0;
    (function next(){ if (++n > 100) return done(); setTimeout(next, 0); })();
  });
  R.seqSetTimeoutMs = +(performance.now() - t1).toFixed(1);

  // 500 queueMicrotask batches
  const t2 = performance.now();
  for (let i = 0; i < 50; i++) {
    await new Promise((r) => { let n = 0; for (let j = 0; j < 10; j++) queueMicrotask(() => { if (++n === 10) r(); }); });
  }
  R.microtaskBatchMs = +(performance.now() - t2).toFixed(1);

  finishCheck();
})();
(function(){
  try {
    const src = 'self.postMessage(self.performance.timeOrigin)';
    const w = new Worker(URL.createObjectURL(new Blob([src], {type:'application/javascript'})));
    w.onmessage = (e) => {
      R.workerTimeOrigin = e.data;
      R.timeOriginDiffMainWorker = +(R.workerTimeOrigin - performance.timeOrigin).toFixed(3);
      finishCheck();
    };
  } catch(e) { R.workerTOErr = e.message; }
})();

// 15. EXACT technique of deviceandbrowserinfo: real Error + poisoned .stack getter + console.debug
R.errStackGetterFired = false;
try {
  const e = new Error('');
  Object.defineProperty(e, 'stack', {
    get() { R.errStackGetterFired = true; return 'POISONED'; },
    set(v) {}, configurable: true,
  });
  console.debug('x', e);
} catch (err) {}
// variant: plain object with poisoned prop
R.plainGetterFired = false;
try {
  const o = {}; Object.defineProperty(o, 'stack', { get(){ R.plainGetterFired = true; return 1; } });
  console.debug('y', o);
} catch (err) {}
// variant: console.log with Error
R.errStackGetterLogFired = false;
try {
  const e2 = new Error('');
  Object.defineProperty(e2, 'stack', { get(){ R.errStackGetterLogFired = true; return ''; }, configurable: true });
  console.log('z', e2);
} catch (err) {}
// 16. Per-call latency of console APIs & Error creation (CDP serialization overhead)
(function(){
  const obj = {a:1,b:'xx'};
  for (let i=0;i<50;i++) console.debug('warm', obj); // warmup
  const bench = (fn, n) => {
    const t = performance.now(); fn(n); return (performance.now()-t)/n*1000; // µs/call
  };
  R.usConsoleDebugObj = +bench((n)=>{for(let i=0;i<n;i++)console.debug('x',obj);},400).toFixed(2);
  R.usConsoleLogStr = +bench((n)=>{for(let i=0;i<n;i++)console.log('hello world',i);},400).toFixed(2);
  R.usNewError = +bench((n)=>{for(let i=0;i<n;i++){const e=new Error();}},5000).toFixed(3);
  R.usCaptureStack = +bench((n)=>{for(let i=0;i<n;i++){try{null.x}catch(e){}};},1000).toFixed(2);
})();

let finished = false;
function finish(){
  if (finished) return; finished = true;
  const s = JSON.stringify(R);
  document.getElementById('out').textContent = 'RESULT:' + s;
}
setTimeout(finish, 6000);
</script></body></html>
